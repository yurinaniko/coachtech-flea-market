date.timezone = "Asia/Tokyo"
; mbstring.internal_encoding はPHP 5.6で非推奨（8.xでは起動時警告が出る）。後継のdefault_charsetを使う。
default_charset = "UTF-8"
; アップロード進捗の追跡は使っていない（Laravel は PHP 標準のセッションを使わない）。
; GHSA-6wmf-4rv5-p3rp が、修正版（8.3.36 以上）にした後も不要なら無効化するよう勧めているため切る。
session.upload_progress.enabled = 0

[mbstring]
mbstring.language = "Japanese"